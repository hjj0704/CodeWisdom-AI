# =====================================================================
# RabbitMQ 3.13 配置
#
# 为什么用文件而不是环境变量：
#   RABBITMQ_* 这类**配置类**环境变量在 RabbitMQ 3.13 起已弃用，
#   而弃用在这里是**致命错误**——容器直接 `exit 1` 崩溃重启，日志只打
#   "deprecated environment variables detected"。不看日志会误判成内存不足被 OOM。
#   （2026-09-16 部署到阿里云时踩到，本机 Docker 上没暴露。）
#
# 部署方式：compose 里挂到 /etc/rabbitmq/rabbitmq.conf
# =====================================================================

# 内存水位：用量达到限额的这个比例时**阻塞发布者**（而不是崩溃）。
# 容器设了 mem_limit 512m，Erlang 会检测 cgroup 限额，所以 0.6 ≈ 307MB 开始限流。
# 默认的 0.4 在这个限额下只有 205MB，对带管理插件的实例偏紧。
vm_memory_high_watermark.relative = 0.6

# 磁盘水位：低于 50MB 时阻塞发布者，防止把服务器磁盘写满
disk_free_limit.absolute = 50MB
