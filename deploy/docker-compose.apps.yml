# T-1102 / T-1103：全栈编排（中间件 + 应用 + 前端）
# 用法（在仓库根目录，先 mvn package && npm run build）：
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.apps.yml up -d

name: codewisdom

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR: codewisdom-gateway/target/codewisdom-gateway-1.0.0-SNAPSHOT.jar
    container_name: cw-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local,nacos
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  project-resource:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR: codewisdom-project-resource/target/codewisdom-project-resource-1.0.0-SNAPSHOT.jar
    container_name: cw-project-resource
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local,nacos
      CW_WORKSPACE_ROOT: /data/repos
    env_file:
      - .env
    volumes:
      - app-repos:/data/repos
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  code-analysis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR: codewisdom-code-analysis/target/codewisdom-code-analysis-1.0.0-SNAPSHOT.jar
    container_name: cw-code-analysis
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local,nacos
      CW_WORKSPACE_ROOT: /data/repos
    env_file:
      - .env
    volumes:
      - app-repos:/data/repos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  agent-orchestration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR: codewisdom-agent-orchestration/target/codewisdom-agent-orchestration-1.0.0-SNAPSHOT.jar
    container_name: cw-agent
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local,nacos
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  evaluation-export:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR: codewisdom-evaluation-export/target/codewisdom-evaluation-export-1.0.0-SNAPSHOT.jar
    container_name: cw-evaluation
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: local,nacos
      CW_WORKSPACE_ROOT: /data/repos
    env_file:
      - .env
    volumes:
      - app-repos:/data/repos
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  ui:
    image: nginx:1.27-alpine
    container_name: cw-ui
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../codewisdom-ui/dist:/usr/share/nginx/html:ro
      - ./nginx/codewisdom-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q html"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-repos:
