spring:
  datasource:
    url: jdbc:mysql://localhost:3306/codewisdom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${CW_DB_USER:cw}
    password: ${CW_DB_PASSWORD:cw123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_evaluation_export

codewisdom:
  workspace:
    root: ${CW_WORKSPACE_ROOT:./data/repos}
  downstream:
    code-analysis-base-url: ${CW_CODE_ANALYSIS_URL:http://127.0.0.1:8082}
  minio:
    enabled: true
    endpoint: ${CW_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${CW_MINIO_USER:codewisdom}
    secret-key: ${CW_MINIO_PASSWORD:codewisdom123}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
