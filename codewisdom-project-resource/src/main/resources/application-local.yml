# 本地开发档：需要本机可用的 MySQL 8（当前由 Docker 提供，Docker 未就绪时用 test 档跑测试）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/codewisdom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${CW_DB_USER:cw}
    password: ${CW_DB_PASSWORD:cw123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
