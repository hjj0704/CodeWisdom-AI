# 本地开发档：需要本机可用的 MySQL 8（当前由 Docker 提供，Docker 未就绪时用 test 档跑测试）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/codewisdom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${CW_DB_USER:cw}
    password: ${CW_DB_PASSWORD:cw123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # ⚠️ 与 code-analysis 共用同一个库 `codewisdom`，两个服务都有 V1__ 开头的脚本。
    # Flyway 的版本号只在**单个历史表内**唯一，共用默认的 flyway_schema_history
    # 会报「版本重复 / 校验和不匹配」——所以每个服务一个历史表。
    # （2026-09-16 T-105 加入 code-analysis 时发现并隔离；新增服务时照抄换后缀。）
    table: flyway_schema_history_project_resource
