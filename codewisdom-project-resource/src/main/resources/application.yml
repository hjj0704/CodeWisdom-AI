server:
  port: 8081

spring:
  application:
    name: codewisdom-project-resource
  profiles:
    active: local
  cloud:
    nacos:
      discovery:
        enabled: false
  servlet:
    multipart:
      # Boot 默认单文件上限仅 1MB，源码压缩包远超此值
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

codewisdom:
  import:
    # 仓库托管域名白名单。留空表示不限域名（仅靠"禁解析到内网"防护），不建议。
    allowed-hosts:
      - github.com
      - gitee.com
      - gitlab.com
      - bitbucket.org
      - codeberg.org
    # 生产环境必须保持 false，否则可被用于探测内网服务（SSRF）
    allow-private-network: false
    max-file-size: 2097152
    max-files: 20000
    clone-timeout-seconds: 180
    clone-depth: 1
    workspace-root: ${CW_WORKSPACE_ROOT:./data/repos}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
