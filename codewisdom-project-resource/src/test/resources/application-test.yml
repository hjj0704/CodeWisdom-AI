# 测试档：H2 内存库（MySQL 兼容模式）
#
# 目的：在没有 Docker / MySQL 的环境下，仍能真实验证 Flyway 建表脚本与
# MyBatis-Plus 映射。注意 H2 只是近似 MySQL，不能替代 1B 阶段的真实 MySQL 验证。
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:codewisdom;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

codewisdom:
  minio:
    enabled: false
  mq:
    enabled: false
    async-import-enabled: false
  auth:
    enabled: false
  import:
    # 工作区放在系统临时目录，不放 target/——Git 写出的 pack 文件带只读属性，
    # 会让 maven-clean-plugin 删除 target 时直接失败，把构建卡死。
    # 清理由测试类的 @AfterAll 负责（见 TestWorkspaces）。
    workspace-root: ${java.io.tmpdir}/codewisdom-test-repos
    # 测试用本地 file:// 仓库，需要放行非 http(s)；生产配置保持 false
    allow-private-network: true
    allowed-hosts:
      - github.com
      - gitee.com
    clone-timeout-seconds: 60
